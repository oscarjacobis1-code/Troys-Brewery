<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team sign in | Troy's Brewery</title><link rel="stylesheet" href="css/app.css"><script src="config.js"></script></head><body><main class="login"><section class="login-card"><a class="brand" style="color:#2d1b12" href="index.html">Troy's <span>Brewery</span></a><h1>Team sign in</h1><p class="muted">Use your individual work account. Shared accounts are not permitted.</p><div id="message" aria-live="polite"></div><form id="login-form"><div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field"><label for="device">Device name</label><input id="device" placeholder="e.g. Counter tablet 1" required></div><button class="btn btn-primary" type="submit">Sign in</button></form></section></main><script type="module" src="js/login.js"></script></body></html>
