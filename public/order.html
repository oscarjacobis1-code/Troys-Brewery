<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order | Troy's Brewery</title><link rel="stylesheet" href="css/app.css"><script src="config.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="index.html">Troy's <span>Brewery</span></a><div class="nav-links"><a href="index.html">Home</a><a aria-current="page" href="order.html">Order</a></div></nav></header><main class="section"><div class="container"><p class="eyebrow">Secure online ordering</p><h1>Build your order</h1><div id="message" aria-live="polite"></div><div class="layout"><section><div id="menu" class="menu-grid"></div></section><aside class="card sticky"><h2>Your order</h2><div id="cart"></div><div class="total row"><span>Total</span><span id="total">G$0</span></div><form id="checkout"><div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="phone">Telephone</label><input id="phone" name="phone" autocomplete="tel" inputmode="tel" required></div><div class="field"><label for="fulfilment">Receive order</label><select id="fulfilment" name="fulfilment"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select></div><div id="address-field" class="field hidden"><label for="address">Delivery address</label><textarea id="address" name="address" autocomplete="street-address"></textarea></div><div class="field"><label for="requested-for">Requested time</label><input id="requested-for" name="requestedFor" type="datetime-local"></div><div class="field"><label for="notes">Order notes</label><textarea id="notes" name="notes" maxlength="500"></textarea></div><button id="place-order" class="btn btn-primary" type="submit">Review and place order</button></form></aside></div></div></main><script type="module" src="js/public-order.js"></script></body></html>
