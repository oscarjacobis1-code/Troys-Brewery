<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff workspace | Troy's Brewery</title><link rel="stylesheet" href="css/app.css"><script src="config.js"></script></head>
<body><header class="topbar"><nav class="nav"><a class="brand" href="index.html">Troy's <span>Brewery</span></a><div class="nav-links"><span id="identity"></span><button id="logout" class="btn btn-secondary">Sign out</button></div></nav></header>
<div class="shell"><nav class="sidebar"><a href="#counter">Counter</a><a href="#board">Preparation board</a></nav><main class="workspace"><div id="message" aria-live="polite"></div>
<section id="counter"><h1>Counter order</h1><div class="layout"><div id="staff-menu" class="menu-grid"></div><aside class="card sticky"><h2>Current order</h2><div id="staff-cart"></div><div class="total row"><span>Total</span><span id="staff-total">G$0</span></div>
<div class="field"><label for="customer-name">Customer name</label><input id="customer-name"></div><div class="field"><label for="counter-fulfilment">Fulfilment</label><select id="counter-fulfilment"><option value="pickup">Pickup</option><option value="dine_in">Dine-in</option><option value="delivery">Delivery</option></select></div>
<div class="field"><label for="payment-method">Payment method</label><select id="payment-method"><option value="cash">Cash</option><option value="mmg">MMG</option><option value="card">Card</option></select></div><div id="payment-reference-field" class="field hidden"><label for="payment-reference">Payment reference</label><input id="payment-reference" autocomplete="off"></div><button id="submit-counter" class="btn btn-primary">Confirm payment and create order</button></aside></div></section>
<section id="board" class="section"><h1>Preparation board</h1><div id="order-board" class="board"></div></section></main></div><script type="module" src="js/staff.js"></script></body></html>
